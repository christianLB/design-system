# Agent Configuration for Design System Enhancement
# This configuration defines specialized AI agents for transforming the design system
# to surpass Material-UI in features, performance, and developer experience

version: "1.0.0"
metadata:
  project: "Design System Beyond MUI"
  created: "2025-08-23"
  description: "Agent orchestration configuration for next-gen UI framework"

# Global agent settings
global:
  default_timeout: 300000 # 5 minutes
  retry_attempts: 3
  error_handling: "graceful"
  logging_level: "info"
  parallelization: true
  max_concurrent_agents: 5

# Agent Registry
agents:
  # === CORE DEVELOPMENT AGENTS ===
  
  theme-architect:
    type: design-specialist
    description: "Advanced theme generation and color theory expert"
    capabilities:
      - theme-generation
      - color-theory
      - accessibility-compliance
      - design-tokens
      - visual-harmony
    priority: critical
    config:
      auto_validate_wcag: true
      generate_variations: true
      optimize_for_performance: true
    tools:
      - color-scale-generator
      - contrast-checker
      - theme-builder
      - design-token-manager
    prompts:
      default: "Generate innovative, accessible themes that surpass Material Design"
      
  component-engineer:
    type: ui-specialist
    description: "React component development with advanced patterns"
    capabilities:
      - react-development
      - typescript-strict
      - animation-engineering
      - accessibility-implementation
      - performance-optimization
    priority: high
    config:
      use_compound_components: true
      implement_render_props: true
      add_ref_forwarding: true
      include_display_name: true
    tools:
      - plop-generator
      - component-scaffolder
      - prop-types-generator
      - story-creator
    prompts:
      default: "Build components with better DX and performance than MUI"
      
  plugin-developer:
    type: integration-specialist
    description: "Plugin architecture and extension system developer"
    capabilities:
      - plugin-architecture
      - api-design
      - performance-optimization
      - dependency-injection
      - hot-module-replacement
    priority: high
    config:
      validate_plugin_interface: true
      ensure_tree_shaking: true
      implement_lazy_loading: true
    tools:
      - plugin-validator
      - performance-profiler
      - bundle-analyzer
    prompts:
      default: "Create extensible plugin system superior to MUI's theming"

  # === QUALITY ASSURANCE AGENTS ===
  
  visual-tester:
    type: qa-specialist
    description: "Visual regression and cross-browser testing expert"
    capabilities:
      - playwright-testing
      - visual-regression
      - cross-browser-testing
      - accessibility-testing
      - interaction-testing
    priority: normal
    config:
      browsers: ["chromium", "firefox", "webkit"]
      viewports: ["mobile", "tablet", "desktop", "4k"]
      test_interactions: true
      capture_animations: true
    tools:
      - playwright
      - percy
      - chromatic
      - axe-core
    prompts:
      default: "Ensure pixel-perfect rendering across all platforms"
      
  perf-optimizer:
    type: performance-specialist
    description: "Bundle optimization and runtime performance expert"
    capabilities:
      - bundle-analysis
      - code-splitting
      - lazy-loading
      - tree-shaking
      - runtime-optimization
    priority: normal
    config:
      target_bundle_size: "50kb"
      enable_compression: true
      optimize_images: true
      implement_caching: true
    tools:
      - rollup-visualizer
      - bundlesize
      - lighthouse
      - webpack-bundle-analyzer
    prompts:
      default: "Achieve 50% smaller bundle than MUI with better performance"

  # === DOCUMENTATION AGENTS ===
  
  api-documenter:
    type: documentation-specialist
    description: "API documentation and example generation"
    capabilities:
      - typedoc-generation
      - storybook-creation
      - example-generation
      - api-reference
      - migration-guides
    priority: normal
    config:
      generate_examples: true
      include_playground: true
      create_tutorials: true
      add_code_snippets: true
    tools:
      - typedoc
      - storybook
      - docusaurus
      - api-extractor
    prompts:
      default: "Create comprehensive docs better than MUI's documentation"

  # === INNOVATION AGENTS ===
  
  ai-features:
    type: ml-specialist
    description: "AI-powered features and smart components"
    capabilities:
      - adaptive-theming
      - user-behavior-analysis
      - personalization
      - predictive-ui
      - gesture-recognition
    priority: high
    config:
      enable_learning: true
      respect_privacy: true
      optimize_for_edge: true
      use_web_workers: true
    tools:
      - tensorflow-js
      - ml-kit
      - gesture-detector
      - behavior-analyzer
    prompts:
      default: "Implement AI features that MUI doesn't have"
      
  dx-enhancer:
    type: developer-experience-specialist
    description: "Developer experience and productivity improvements"
    capabilities:
      - cli-development
      - code-generation
      - intellisense-enhancement
      - error-messaging
      - debugging-tools
    priority: high
    config:
      provide_suggestions: true
      generate_snippets: true
      add_codemods: true
      create_migrations: true
    tools:
      - plop
      - jscodeshift
      - ts-morph
      - prettier
    prompts:
      default: "Make developer experience 10x better than MUI"

  # === SPECIALIZED AGENTS ===
  
  animation-specialist:
    type: motion-designer
    description: "Advanced animation and micro-interaction expert"
    capabilities:
      - spring-physics
      - gesture-animations
      - scroll-animations
      - page-transitions
      - micro-interactions
    priority: normal
    config:
      use_gpu_acceleration: true
      implement_reduced_motion: true
      optimize_fps: 60
      add_easing_functions: true
    tools:
      - framer-motion
      - lottie
      - gsap
      - motion-one
    prompts:
      default: "Create smooth animations better than Material Design"
      
  data-viz-expert:
    type: visualization-specialist
    description: "Data visualization and charting components"
    capabilities:
      - chart-generation
      - data-processing
      - interactive-graphics
      - real-time-updates
      - responsive-design
    priority: normal
    config:
      support_large_datasets: true
      enable_webgl: true
      add_animations: true
      implement_zoom_pan: true
    tools:
      - d3
      - visx
      - recharts
      - plotly
    prompts:
      default: "Build data visualization superior to MUI X Charts"

# Agent Collaboration Rules
collaboration:
  pairs:
    - agents: [theme-architect, component-engineer]
      trigger: "component-theming"
      description: "Collaborate on themeable component design"
      
    - agents: [component-engineer, visual-tester]
      trigger: "component-testing"
      description: "Test components during development"
      
    - agents: [plugin-developer, perf-optimizer]
      trigger: "plugin-optimization"
      description: "Optimize plugin performance"
      
    - agents: [ai-features, dx-enhancer]
      trigger: "smart-dx"
      description: "AI-powered developer experience"
      
  chains:
    component-pipeline:
      agents: [component-engineer, visual-tester, api-documenter]
      description: "Complete component development pipeline"
      
    theme-pipeline:
      agents: [theme-architect, plugin-developer, perf-optimizer]
      description: "Theme development and optimization"
      
    quality-pipeline:
      agents: [visual-tester, perf-optimizer, api-documenter]
      description: "Quality assurance pipeline"

# Agent Triggers
triggers:
  on_commit:
    agents: [visual-tester, perf-optimizer]
    conditions:
      - files_changed: "src/components/**"
      
  on_pr:
    agents: [component-engineer, visual-tester, api-documenter]
    conditions:
      - target_branch: "main"
      
  scheduled:
    daily:
      agents: [perf-optimizer]
      time: "02:00"
      
    weekly:
      agents: [theme-architect, ai-features]
      day: "sunday"
      time: "03:00"
      
  manual:
    commands:
      "/enhance-component": [component-engineer, animation-specialist]
      "/optimize-bundle": [perf-optimizer]
      "/generate-theme": [theme-architect]
      "/add-ai-feature": [ai-features]

# Success Metrics
metrics:
  performance:
    bundle_size: "<100kb"
    load_time: "<2s"
    fps: ">60"
    lighthouse_score: ">95"
    
  quality:
    test_coverage: ">95%"
    accessibility_score: "100"
    typescript_strict: true
    visual_regression: "0"
    
  developer_experience:
    component_creation_time: "<5min"
    theme_customization_time: "<1min"
    documentation_completeness: "100%"
    api_consistency: "100%"
    
  innovation:
    unique_features: ">20"
    ai_features: ">5"
    plugin_count: ">50"
    community_contributions: ">100"

# Reporting
reporting:
  format: "markdown"
  frequency: "weekly"
  recipients:
    - "project-lead"
    - "dev-team"
  include:
    - metrics
    - agent_activity
    - improvements
    - recommendations
  storage:
    path: ".ai/reports"
    retention: "90d"