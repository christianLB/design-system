# Quality Gates Configuration
# Automated quality checks that must pass before code can be merged or deployed

version: "1.0.0"
metadata:
  description: "Quality gate definitions to ensure superior quality vs MUI"
  enforcement: strict
  bypass_allowed: false

# Global Quality Settings
global:
  fail_fast: false # Run all checks even if some fail
  parallel_execution: true
  cache_results: true
  report_format: "markdown"
  report_path: ".ai/reports/quality"

# Quality Gate Definitions
gates:
  # === CODE QUALITY GATES ===
  
  code-quality:
    name: "Code Quality Standards"
    priority: critical
    checks:
      - id: biome-lint
        name: "Biome Linting"
        command: "pnpm lint"
        threshold:
          errors: 0
          warnings: 5
        required: true
        
      - id: typescript-strict
        name: "TypeScript Strict Mode"
        command: "pnpm type-check"
        config:
          strict: true
          noUncheckedIndexedAccess: true
          exactOptionalPropertyTypes: true
        threshold:
          errors: 0
        required: true
        
      - id: complexity
        name: "Code Complexity"
        tool: "complexity-analyzer"
        threshold:
          cyclomatic: 10
          cognitive: 15
          lines_per_function: 50
        required: false
        
      - id: duplication
        name: "Code Duplication"
        tool: "jscpd"
        threshold:
          percentage: 3
        required: false

  # === TESTING GATES ===
  
  testing:
    name: "Testing Requirements"
    priority: critical
    checks:
      - id: unit-tests
        name: "Unit Test Coverage"
        command: "pnpm test:coverage"
        threshold:
          statements: 95
          branches: 90
          functions: 95
          lines: 95
        required: true
        
      - id: component-tests
        name: "Component Tests"
        command: "pnpm test:ct"
        threshold:
          pass_rate: 100
        required: true
        
      - id: visual-regression
        name: "Visual Regression"
        command: "pnpm test:visual"
        threshold:
          changes: 0
          review_required: true
        required: true
        
      - id: accessibility
        name: "Accessibility Tests"
        tool: "axe-core"
        threshold:
          violations: 0
          wcag_level: "AAA"
        required: true
        
      - id: integration
        name: "Integration Tests"
        command: "pnpm test:integration"
        threshold:
          pass_rate: 100
        required: false

  # === PERFORMANCE GATES ===
  
  performance:
    name: "Performance Benchmarks"
    priority: high
    checks:
      - id: bundle-size
        name: "Bundle Size"
        command: "pnpm bundlesize"
        threshold:
          main: "100kb"
          chunks: "50kb"
          css: "30kb"
        comparison:
          mui: "50%" # Must be 50% smaller than MUI
        required: true
        
      - id: load-time
        name: "Load Time"
        tool: "lighthouse"
        threshold:
          fcp: 1000 # First Contentful Paint
          lcp: 2000 # Largest Contentful Paint
          tti: 3000 # Time to Interactive
          cls: 0.1 # Cumulative Layout Shift
        required: true
        
      - id: runtime-perf
        name: "Runtime Performance"
        tool: "performance-profiler"
        threshold:
          fps: 60
          memory_leak: false
          render_time: 16 # ms
        required: true
        
      - id: lighthouse-score
        name: "Lighthouse Score"
        command: "lighthouse"
        threshold:
          performance: 95
          accessibility: 100
          best_practices: 95
          seo: 95
          pwa: 90
        required: true

  # === SECURITY GATES ===
  
  security:
    name: "Security Checks"
    priority: critical
    checks:
      - id: dependency-scan
        name: "Dependency Vulnerabilities"
        command: "pnpm audit"
        threshold:
          critical: 0
          high: 0
          moderate: 2
          low: 5
        required: true
        
      - id: code-scan
        name: "Code Security"
        tool: "semgrep"
        threshold:
          critical: 0
          high: 0
        required: true
        
      - id: secrets-scan
        name: "Secret Detection"
        tool: "gitleaks"
        threshold:
          secrets: 0
        required: true
        
      - id: license-check
        name: "License Compliance"
        tool: "license-checker"
        allowed_licenses:
          - MIT
          - Apache-2.0
          - BSD-3-Clause
        required: true

  # === DOCUMENTATION GATES ===
  
  documentation:
    name: "Documentation Requirements"
    priority: normal
    checks:
      - id: api-docs
        name: "API Documentation"
        tool: "typedoc"
        threshold:
          coverage: 100
          examples: true
        required: true
        
      - id: storybook
        name: "Storybook Stories"
        command: "pnpm storybook:build"
        threshold:
          stories_per_component: 3
          docs_page: true
        required: true
        
      - id: readme
        name: "README Completeness"
        tool: "readme-scorer"
        threshold:
          score: 90
        required: false
        
      - id: changelog
        name: "Changelog Entry"
        tool: "changeset"
        threshold:
          has_changeset: true
        required: true

  # === COMPATIBILITY GATES ===
  
  compatibility:
    name: "Browser Compatibility"
    priority: high
    checks:
      - id: browser-support
        name: "Browser Support"
        tool: "browserstack"
        browsers:
          - chrome: "latest-2"
          - firefox: "latest-2"
          - safari: "latest-2"
          - edge: "latest-2"
        threshold:
          pass_rate: 100
        required: true
        
      - id: mobile-support
        name: "Mobile Support"
        tool: "playwright"
        devices:
          - "iPhone 12"
          - "Pixel 5"
          - "iPad Pro"
        threshold:
          pass_rate: 100
        required: true
        
      - id: react-versions
        name: "React Compatibility"
        versions:
          - "17.0.0"
          - "18.0.0"
          - "19.0.0"
        threshold:
          pass_rate: 100
        required: true

  # === MUI COMPARISON GATES ===
  
  mui-superiority:
    name: "MUI Comparison Benchmarks"
    priority: critical
    checks:
      - id: feature-parity
        name: "Feature Parity Check"
        tool: "feature-comparator"
        baseline: "@mui/material@latest"
        threshold:
          coverage: 100
          additional_features: 10
        required: true
        
      - id: performance-comparison
        name: "Performance vs MUI"
        tool: "benchmark-suite"
        comparison:
          bundle_size: "<50%"
          render_time: "<70%"
          memory_usage: "<80%"
        required: true
        
      - id: dx-comparison
        name: "Developer Experience"
        metrics:
          api_consistency: ">95%"
          typescript_support: "100%"
          documentation_quality: ">90%"
          setup_time: "<5min"
        required: true
        
      - id: accessibility-comparison
        name: "Accessibility vs MUI"
        tool: "axe-compare"
        threshold:
          better_than_mui: true
          wcag_aaa: true
        required: true

# Gate Execution Rules
execution:
  stages:
    - name: "pre-commit"
      gates:
        - code-quality
        - testing.unit-tests
      timeout: 60000
      
    - name: "pre-push"
      gates:
        - code-quality
        - testing
        - performance.bundle-size
      timeout: 180000
      
    - name: "pull-request"
      gates:
        - code-quality
        - testing
        - performance
        - documentation
        - mui-superiority
      timeout: 600000
      
    - name: "pre-release"
      gates:
        - "*" # All gates
      timeout: 1800000
      
  conditions:
    skip_on_draft: true
    skip_on_wip: true
    require_approval: ["security", "mui-superiority"]
    
# Reporting Configuration
reporting:
  summary:
    format: "markdown"
    include:
      - pass_fail_status
      - detailed_metrics
      - comparison_charts
      - recommendations
      
  detailed:
    format: "html"
    include:
      - all_check_results
      - performance_graphs
      - coverage_reports
      - mui_comparison
      
  notifications:
    channels:
      - type: "github"
        events: ["fail", "warning"]
      - type: "slack"
        events: ["fail"]
        
# Override Rules
overrides:
  allowed_by:
    - role: "maintainer"
      gates: ["documentation"]
    - role: "admin"
      gates: ["*"]
      
  temporary_bypass:
    max_duration: "7d"
    requires_justification: true
    requires_ticket: true
    
# Improvement Tracking
improvements:
  track_trends: true
  compare_releases: true
  generate_insights: true
  
  metrics:
    - bundle_size_reduction
    - performance_improvement
    - test_coverage_increase
    - mui_gap_closure
    
  goals:
    quarterly:
      bundle_size: "-10%"
      performance: "+15%"
      test_coverage: "+5%"
      mui_superiority: "+20%"